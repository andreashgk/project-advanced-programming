## Melon pick-ups that can be collected to give extra points. By default, melons give 100 points each.
[[entity]]
type = "melon"
pos = [0.0, 0.15]

[[entity]]
type = "melon"
pos = [-0.15, 0.15]

[[entity]]
type = "melon"
pos = [0.15, 0.15]

[[entity]]
type = "melon"
pos = [-0.3, 0.15]

[[entity]]
type = "melon"
pos = [0.4166, 2.1666]
## The score that is received when collecing a melon can also be manually set using the `score` key.
score = 200

[[entity]]
type = "melon"
pos = [0.65, 1.75]
score = 150

## The finish is the destination that needs to be reached in order to complete a level. It looks like a flag in-game.
## Multiple of these can exists in the world.
[[entity]]
type = "finish"
pos = [-0.58333, 2.1626]

## The player entity should always be included in the level in order to make it playable. The player should preferrably
## always be the last entry, so it can be rendered on top of all the other entities.
[[entity]]
type = "player"
pos = [0.0, -0.1666]
