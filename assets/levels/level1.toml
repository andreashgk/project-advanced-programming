## The display name of the level in the level selector.
name = "Level 1"

[camera]
## The starting position of the camera
pos = [0.0, 0.0]
## The maximum position the camera can be in. This is where the camera will move towards if its speed != 0. The camera
## will never go farther than this point, even if it is moved by the player.
destination = [0.0, 1.9166]
## The speed factor of the camera. If zero, the camera will not move by itself.
speed = 0.0

[tilemap_config]
## The tileset to use. Corresponds with a file in `assets/tilesets/`.
tileset = "terrain.png"
## The tile to fill in outside of the actual tilemaps.
default_tile = "wall"
## The variant of the tile above.
default_variant = 4

# Entities
# --------
# Each entity should contain at least a type and the position of the entity. Some entities, such as a tilemap, require
# some extra data in order to be created.

[[entity]]
type = "tilemap"
pos = [0.0, -0.5]
scale = [0.08333, 0.08333]
### Tilemap data
[entity.tilemap]
## How many tiles the tilemap should have in the x-axis. The position of the tilemap corresponds with the middle collumn
## of these tiles.
width = 22
## The amount of tiles the tilemap should have in the y-axis. The position of the tilemap corresponds with the lowest
## row of tiles.
height = 34
## The palette defines all the types of tiles used in the tilemap. The names correspond with entries in the tileset (see
## `[tilemap_config]`). The added tiles and all their variants can then be used to specify the actual content of the
## tilemap.
## Each tile type in the palette may also optionall specify a collider, existing of zero, one or many axis-aligned
## rectangles (they cannot be rotated). (0, 0) is always the bottom left of the tile, (1, 1) is always the top right.
palette = [
    { name = "air" },                                       #0
    { name = "wall", hitbox = [[0.0, 0.0, 1.0, 1.0]] },     #1
    { name = "grass", hitbox = [[0.0, 0.0, 1.0, 1.0]] },    #2
    { name = "grass2", hitbox = [[0.0, 0.0, 1.0, 1.0]] },   #3
    { name = "brick", hitbox = [[0.0, 0.0, 1.0, 1.0]] },    #4
    { name = "wood", hitbox = [[0.0, 0.0, 1.0, 1.0]] },     #5
    { name = "gold", hitbox = [[0.0, 0.0, 1.0, 1.0]] },     #6
    { name = "iron", hitbox = [[0.0, 0.0, 1.0, 1.0]] },     #7
]
## The content of the tilemap. Should be an array with exactly widht*height entries. It is specified in row-major order,
## meaning entries `0 -> width-1` are the first row (left->right), `width -> 2*width -1` is the second row, etc. The
## first row that is specified is the bottom row in-game.
## The format is "<palette_index>:<variant>". The palette_index tells the game which tile type from the palette to use,
## starting from zero. The variant is the variant number of that tile type. This variant should exist in the tileset.
